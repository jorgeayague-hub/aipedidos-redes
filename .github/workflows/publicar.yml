name: Publicar en Instagram y Facebook

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "publicar, probar (solo verifica las claves) o simular"
        required: false
        default: "publicar"

permissions:
  contents: write
  issues: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - name: Publicar lo que ya venció
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          MEDIA_BASE: ${{ vars.MEDIA_BASE }}
          MODO: ${{ github.event.inputs.modo || 'publicar' }}
        run: |
          case "$MODO" in
            probar) python publicar.py --probar ;;
            simular) python publicar.py --simular ;;
            *) python publicar.py ;;
          esac
      - name: Guardar el estado
        run: |
          git config user.name "publicador-aipedidos"
          git config user.email "publicador-aipedidos@users.noreply.github.com"
          git add estado
          if ! git diff --cached --quiet; then
            git commit -m "Estado de publicaciones"
            git pull --rebase --quiet
            git push
          fi
      - name: Avisar si algo no salió
        if: ${{ hashFiles('estado/aviso.txt') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "No se pudo publicar en AiPedidos" --body-file estado/aviso.txt
